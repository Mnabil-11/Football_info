# Template — Fly app names are globally unique, so run `fly launch --no-deploy`
# once to generate/claim a real `app` name, or edit the placeholder below
# before `fly deploy`. See DEPLOY.md for the full walkthrough.
app = "football-info-api"
primary_region = "iad"

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[env]
  NODE_ENV = "production"
  PORT = "4000"
