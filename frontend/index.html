<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
    <title>متتبع كرة القدم — مباريات، ترتيب، وإحصائيات مباشرة</title>
    <meta
      name="description"
      content="تابع مباريات كرة القدم، جداول الترتيب، الهدافين، وتفاصيل المباريات المباشرة لأبرز الدوريات العالمية."
    />
    <link rel="canonical" href="https://football-info.example.com/" />

    <!-- Open Graph / social previews. NOTE: this is a client-rendered SPA, so
         crawlers that don't execute JS (most link-preview bots) only ever see
         these static, homepage-level tags — per-page OG data would need
         server rendering, which this app doesn't do. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="متتبع كرة القدم" />
    <meta property="og:title" content="متتبع كرة القدم — مباريات، ترتيب، وإحصائيات مباشرة" />
    <meta
      property="og:description"
      content="تابع مباريات كرة القدم، جداول الترتيب، الهدافين، وتفاصيل المباريات المباشرة لأبرز الدوريات العالمية."
    />
    <meta property="og:url" content="https://football-info.example.com/" />
    <meta property="og:locale" content="ar_AR" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="متتبع كرة القدم" />
    <meta
      name="twitter:description"
      content="تابع مباريات كرة القدم، جداول الترتيب، الهدافين، وتفاصيل المباريات المباشرة لأبرز الدوريات العالمية."
    />
    <script>
      // Set the theme class before first paint so there's no flash of the
      // wrong theme while React hydrates.
      (function () {
        var stored = localStorage.getItem('theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
